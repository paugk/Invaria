[project]
name = "invaria"
version = "0.0.0"
description = "Invaria core: canonical contracts, CSV ingestion, pure evaluator, offline R1/R2 bundle replay with Ed25519 signatures, read-only Stellar testnet adapter, and append-only PostgreSQL persistence with invalidation."
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "cryptography>=46,<51",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
db = [
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
invaria = "invaria.cli:main"

[dependency-groups]
dev = [
    "psycopg[binary]>=3.2,<4",
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.14",
    "mypy>=1.18",
]

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "live_testnet: queries the public Stellar testnet; opt-in via INVARIA_LIVE_TESTNET=1",
    "postgres: needs a real PostgreSQL; opt-in via INVARIA_TEST_DATABASE_URL",
]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests/contracts", "tests/ingest", "tests/engine", "tests/bundle", "tests/stellar", "tests/persistence"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
