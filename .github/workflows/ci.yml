name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      INVARIA_TEST_DATABASE_URL: postgresql://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv (pinned)
        run: python3 -m pip install --user "uv==0.11.26"
      - name: Install locked environment
        run: uv sync --locked
      - name: Lint, format, types
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
      - name: Tests (PostgreSQL service; live testnet test stays opt-in and skipped)
        run: uv run --locked pytest -q
      - name: Offline scenario checks
        run: |
          uv run --locked invaria check tests/fixtures/corpus/subscription-synthetic
          uv run --locked invaria demo-testnet tests/fixtures/corpus/subscription-testnet
          uv run --locked invaria verify tests/fixtures/bundles/K3
