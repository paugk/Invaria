name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
    env:
      INVARIA_TEST_DATABASE_URL: postgresql://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv (pinned)
        run: python3 -m pip install --user "uv==0.11.26"
      - name: Install locked environment
        run: uv sync --locked
      - name: Lint, format, types
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked mypy
      - name: Tests (PostgreSQL service; live testnet test stays opt-in and skipped)
        # The ledger verification tests need the pinned Stellar CLI: they run in their own
        # job, where a missing CLI fails, so they are not reported here as skipped.
        run: uv run --locked pytest -q --ignore=tests/stellar/test_ledger_proof.py
      - name: Offline scenario checks
        run: |
          uv run --locked invaria check tests/fixtures/corpus/subscription-synthetic
          uv run --locked invaria check tests/fixtures/corpus/subscription-synthetic-1.2.0
          uv run --locked invaria check tests/fixtures/corpus/redemption-synthetic-1.7.0
          uv run --locked invaria demo-testnet tests/fixtures/corpus/subscription-testnet-1.6.0
          # read-only explanation views (no new result)
          uv run --locked invaria diagnose tests/fixtures/corpus/subscription-synthetic-1.2.0 K2
          uv run --locked invaria obligations tests/fixtures/corpus/redemption-synthetic-1.7.0 RD-CANCELLED-AFTER-DUE
          uv run --locked invaria obligations tests/fixtures/corpus/subscription-synthetic-1.2.0 K2 --json > /dev/null
          uv run --locked invaria verify tests/fixtures/bundles/K3-engine-0.10.0 \
            --expect-manifest-sha256 d612eb4ed9b1a951b9d2a94558d2f3f82599113899dfeef79f7156abcdf4ba64
          # historical golden of the retired 0.1.0, reproduced by its compatibility implementation
          uv run --locked invaria verify tests/fixtures/bundles/K3 --expect-manifest-sha256 bec6969130fed2f8d64ca92c65fb6c4808c5d5beae65e83bd1283cd61c7b447f
  ledger-verification:
    runs-on: ubuntu-latest
    env:
      STELLAR_CLI_URL: https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz
      STELLAR_CLI_SHA256: c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv (pinned)
        run: python3 -m pip install --user "uv==0.11.26"
      - name: Install locked environment
        run: uv sync --locked
      - name: Install Stellar CLI 28.1.0 (pinned, checksum verified)
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/stellar-cli.tar.gz" "$STELLAR_CLI_URL"
          echo "$STELLAR_CLI_SHA256  $RUNNER_TEMP/stellar-cli.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stellar-cli"
          tar -xzf "$RUNNER_TEMP/stellar-cli.tar.gz" -C "$RUNNER_TEMP/stellar-cli"
          dirname "$(find "$RUNNER_TEMP/stellar-cli" -type f -name stellar -perm -u+x | head -1)" >> "$GITHUB_PATH"
      - name: Require the pinned version
        shell: bash
        run: stellar --version | head -1 | grep -q '^stellar 28\.1\.0 '
      - name: Ledger verification tests (a missing CLI fails; a skip is not accepted)
        shell: bash
        run: |
          INVARIA_REQUIRE_STELLAR_CLI=1 uv run --locked pytest -q -rs tests/stellar/test_ledger_proof.py | tee "$RUNNER_TEMP/ledger.out"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/ledger.out"; then
            echo "skipped ledger verification tests are not a verification"; exit 1
          fi
      - name: Offline reports from kept artifacts (no state download, no replay)
        shell: bash
        run: |
          F=tests/fixtures/stellar/ledger-archive/checkpoint-5027711
          STORE="$RUNNER_TEMP/store"
          uv run --locked invaria stellar ingest --target tests/fixtures/stellar/targets/demoa-own.json \
            --start-ledger 5027650 --end-ledger 5027672 --store "$STORE" \
            --links tests/fixtures/stellar/links/demoa-own.json --page-limit 2 \
            --recorded-at 2026-10-05T00:59:44Z --replay tests/fixtures/stellar/recordings/demoa-own
          uv run --locked invaria stellar ledger-verify --archive-dir "$F/archive" --ledger 5027711 \
            --anchor-run "$F/anchor-run/anchor-run.json" \
            --target tests/fixtures/stellar/targets/demoa-own.json --store "$STORE" \
            --replay-dir "$F/replay" \
            --expect-replay-record-sha256 b7459be8c89d05d360e990cdf81bec4c7a5c7930deca6aa8f8d55c48deb9cdc2 \
            --expect-replay-revision-sha256 89b1b95f79f78710cd4ed89228e2947e6b4dea766b6bb0b427348110cab66ddd \
            --completeness-ledgers 5027650 5027672 \
            --horizon-recording tests/fixtures/stellar/recordings/demoa-own
          # trustline reconciliation report over the same kept replay
          uv run --locked invaria stellar ledger-verify --archive-dir "$F/archive" --ledger 5027711 \
            --anchor-run "$F/anchor-run/anchor-run.json" \
            --target tests/fixtures/stellar/targets/demoa-own.json --store "$STORE" \
            --replay-dir "$F/replay" \
            --expect-replay-record-sha256 b7459be8c89d05d360e990cdf81bec4c7a5c7930deca6aa8f8d55c48deb9cdc2 \
            --expect-replay-revision-sha256 89b1b95f79f78710cd4ed89228e2947e6b4dea766b6bb0b427348110cab66ddd \
            --trustline-reconciliation 2026-10-05T00:57:20Z 2026-10-05T00:59:00Z \
            --approved-links tests/fixtures/corpus/subscription-testnet-1.6.0/identity_links.json \
            --account-ref acct-pseudo-0001
